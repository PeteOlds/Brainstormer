version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brainstormer
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brainstormer-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - brainstormer-network

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - brainstormer-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: flask run --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD:-devpassword}@postgres:5432/brainstormer
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      - JWT_ACCESS_TOKEN_EXPIRES=${JWT_ACCESS_TOKEN_EXPIRES:-86400}
      - FERNET_KEY=${FERNET_KEY:-dev-fernet-key-change-in-production==}
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - brainstormer-network

  worker-ollama:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: celery -A app.tasks worker -Q ollama -c 1 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD:-devpassword}@postgres:5432/brainstormer
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      - FERNET_KEY=${FERNET_KEY:-dev-fernet-key-change-in-production==}
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - brainstormer-network

  worker-default:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: celery -A app.tasks worker -Q default -c 4 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD:-devpassword}@postgres:5432/brainstormer
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brainstormer-network

  scheduler:
    build:
      context: . 
      dockerfile: Dockerfile
      target: development
    command: celery -A app.tasks beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD:-devpassword}@postgres:5432/brainstormer
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brainstormer-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  brainstormer-network:
    driver: bridge