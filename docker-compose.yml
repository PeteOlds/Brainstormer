version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brainstormer
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brainstormer-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - brainstormer-network

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - brainstormer-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: gunicorn -w 2 -b 0.0.0.0:8000 wsgi:app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD}@postgres:5432/brainstormer
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRES=${JWT_ACCESS_TOKEN_EXPIRES:-86400}
      - FERNET_KEY=${FERNET_KEY}
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - brainstormer-network

  worker-ollama:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: python3 celery_worker.py ollama 1
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD}@postgres:5432/brainstormer
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FERNET_KEY=${FERNET_KEY}
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - brainstormer-network

  worker-default:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: python3 celery_worker.py default 4
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD}@postgres:5432/brainstormer
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brainstormer-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: python3 celery_beat.py
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD}@postgres:5432/brainstormer
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brainstormer-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/litellm_config.yaml", "--port", "4000", "--num_workers", "2"]
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://app:${DB_PASSWORD}@postgres:5432/litellm
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - brainstormer-network

  # One-shot: creates the LiteLLM database if missing (idempotent).
  litellm-db-init:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - psql "postgresql://app:$${DB_PASSWORD}@postgres:5432/postgres" -tc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1 || psql "postgresql://app:$${DB_PASSWORD}@postgres:5432/postgres" -c "CREATE DATABASE litellm"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brainstormer-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  brainstormer-network:
    driver: bridge