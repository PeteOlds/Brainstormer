# LiteLLM proxy (item 10): virtual-key isolation for hosted providers.
#
# Raw provider keys live ONLY here (server-side). The app holds virtual
# keys issued via /key/generate (see: flask provision-proxy-key) and
# budgets/spend stay enforced in the app. One-time setup:
#   CREATE DATABASE litellm;   (as the postgres superuser)
# then set LITELLM_MASTER_KEY and start the litellm compose service.
# Model list is intentionally empty: keys are provisioned per tenant
# with explicit model allowlists, never a global default.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  database_url: os.environ/DATABASE_URL

model_list: []
