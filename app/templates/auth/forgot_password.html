{% extends "base.html" %}
{% block title %}Forgot password - Brainstormer{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <h1 class="text-2xl font-bold mb-4">Forgot your password?</h1>
  <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">Enter your email and we'll send a reset link.</p>
  <div id="msg" class="hidden mb-4 p-3 rounded text-sm"></div>
  <form id="form" class="space-y-4">
    <input id="email" type="email" required placeholder="you@example.com" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700" />
    <button type="submit" class="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg">Send reset link</button>
  </form>
  <p class="mt-4 text-sm"><a href="/login" class="text-indigo-600">Back to login</a></p>
</div>
<script nonce="{{ csp_nonce() }}">
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.classList.add('hidden');
  const res = await fetch('/api/v1/forgot-password', {
    method: 'POST',
    credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: document.getElementById('email').value.trim()})
  });
  const data = await res.json();
  msg.textContent = (data.data && data.data.message) || data.message || 'Done.';
  msg.classList.remove('hidden');
});
</script>
{% endblock %}
