{% extends "base.html" %}
{% block title %}Reset password - Brainstormer{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <h1 class="text-2xl font-bold mb-4">Reset your password</h1>
  <div id="msg" class="hidden mb-4 p-3 rounded text-sm"></div>
  <form id="form" class="space-y-4">
    <input id="password" type="password" required placeholder="New password (8+ chars)" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700" />
    <input id="confirm" type="password" required placeholder="Confirm password" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700" />
    <button type="submit" class="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg">Reset password</button>
  </form>
  <p class="mt-4 text-sm"><a href="/login" class="text-indigo-600">Back to login</a></p>
</div>
<script nonce="{{ csp_nonce() }}">
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
const msg = document.getElementById('msg');
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.classList.add('hidden');
  const pw = document.getElementById('password').value;
  const cf = document.getElementById('confirm').value;
  if (pw !== cf) { msg.textContent = 'Passwords do not match.'; msg.classList.remove('hidden'); return; }
  const res = await fetch('/api/v1/reset-password', {
    method: 'POST',
    credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token, password: pw})
  });
  const data = await res.json();
  if (res.ok) {
    msg.textContent = 'Password reset. Redirecting to login...';
    msg.classList.remove('hidden');
    setTimeout(() => { window.location.href = '/login'; }, 1200);
  } else {
    msg.textContent = data.message || 'Reset failed.';
    msg.classList.remove('hidden');
  }
});
</script>
{% endblock %}
