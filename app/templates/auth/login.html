{% extends "base_auth.html" %}
{% block title %}Login - Brainstormer{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <div class="text-center">
            <div class="mx-auto h-12 w-12 bg-indigo-100 rounded-full flex items-center justify-center">
                <svg class="h-7 w-7 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                </svg>
            </div>
            <h2 class="mt-6 text-2xl font-bold text-slate-900">Sign in to Brainstormer</h2>
            <p class="mt-2 text-sm text-slate-600">Or <a href="/register" class="font-medium text-indigo-600 hover:text-indigo-500">create a new account</a></p>
        </div>

        <div id="error-box" class="hidden rounded-lg bg-red-50 border border-red-200 p-3 text-sm text-red-700"></div>
        <div id="success-box" class="hidden rounded-lg bg-green-50 border border-green-200 p-3 text-sm text-green-700"></div>

        <form id="login-form" class="mt-8 space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required
                       class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                       placeholder="you@example.com" value="admin@example.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                       class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                       placeholder="••••••••" value="admin123">
            </div>
            <div class="flex items-center justify-between">
                <label class="flex items-center space-x-2">
                    <input type="checkbox" name="remember_me" id="remember_me" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    <span class="text-sm text-slate-700 dark:text-slate-300">Remember me</span>
                </label>
            </div>
            <button id="submit-btn" type="submit" class="w-full flex justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50">
                <span id="btn-text">Sign in</span>
                <span id="btn-spinner" class="hidden ml-2 inline-flex items-center">
                    <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </span>
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-6">Demo: admin@example.com / admin123</p>
    </div>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const btnText = document.getElementById("btn-text");
    const spinner = document.getElementById("btn-spinner");
    const errBox = document.getElementById("error-box");
    const succBox = document.getElementById("success-box");
    errBox.classList.add("hidden");
    succBox.classList.add("hidden");
    btn.disabled = true;
    btnText.textContent = "Signing in...";
    spinner.classList.remove("hidden");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const remember = document.getElementById('remember_me').checked;
        const res = await fetch("/api/v1/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password, remember: remember})
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
            throw new Error(data.message || data.msg || "Login failed");
        }
        localStorage.setItem("access_token", data.data.access_token);
        localStorage.setItem("refresh_token", data.data.refresh_token);
        localStorage.setItem("user", JSON.stringify(data.data.user));
        succBox.textContent = "Login successful — redirecting...";
        succBox.classList.remove("hidden");
        setTimeout(() => { window.location.href = "/ideas"; }, 600);
    } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
        btn.disabled = false;
        btnText.textContent = "Sign in";
        spinner.classList.add("hidden");
    }
});
</script>
{% endblock %}
