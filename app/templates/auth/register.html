{% extends "base_auth.html" %}
{% block title %}Register - Brainstormer{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <div class="text-center">
            <div class="mx-auto h-12 w-12 bg-indigo-100 rounded-full flex items-center justify-center">
                <svg class="h-7 w-7 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
            </div>
            <h2 class="mt-6 text-2xl font-bold text-slate-900">Create your account</h2>
            <p class="mt-2 text-sm text-slate-600">Already have an account? <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500">Sign in</a></p>
        </div>
        <div id="error-box" class="hidden rounded-lg bg-red-50 border border-red-200 p-3 text-sm text-red-700"></div>
        <div id="success-box" class="hidden rounded-lg bg-green-50 border border-green-200 p-3 text-sm text-green-700"></div>
        <form id="register-form" class="mt-8 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Name (optional)</label>
                <input id="name" type="text" placeholder="Your name" class="block w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email address</label>
                <input id="email" type="email" required placeholder="you@example.com" class="block w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input id="password" type="password" required placeholder="Min 8 characters" class="block w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button id="submit-btn" type="submit" class="w-full flex justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 disabled:opacity-50">
                <span id="btn-text">Create account</span>
                <span id="btn-spinner" class="hidden ml-2"><svg class="animate-spin h-4 w-4 text-white inline" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg></span>
            </button>
        </form>
    </div>
</div>
<script>
document.getElementById("register-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const btn=document.getElementById("submit-btn"), txt=document.getElementById("btn-text"), spin=document.getElementById("btn-spinner"), err=document.getElementById("error-box"), succ=document.getElementById("success-box");
    err.classList.add("hidden"); succ.classList.add("hidden");
    btn.disabled=true; txt.textContent="Creating..."; spin.classList.remove("hidden");
    try{
        const res=await fetch("/api/v1/register",{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:document.getElementById("name").value, email:document.getElementById("email").value.trim(), password:document.getElementById("password").value})});
        const data=await res.json();
        if(!res.ok||!data.success) throw new Error(data.message||data.msg||"Registration failed");
        localStorage.setItem("access_token", data.data.access_token);
        localStorage.setItem("refresh_token", data.data.refresh_token);
        localStorage.setItem("user", JSON.stringify(data.data.user));
        succ.textContent="Account created — redirecting..."; succ.classList.remove("hidden");
        setTimeout(()=>window.location.href="/ideas",600);
    }catch(er){ err.textContent=er.message; err.classList.remove("hidden"); btn.disabled=false; txt.textContent="Create account"; spin.classList.add("hidden");}
});
</script>
{% endblock %}
