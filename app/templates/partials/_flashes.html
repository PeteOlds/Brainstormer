<div class="fixed top-20 right-4 z-50 space-y-2" x-data="{ flashes: {{ messages | tojson }} }" x-init="
    setTimeout(() => {
        flashes.forEach((_, i) => {
            setTimeout(() => flashes.splice(i, 1), 5000);
        });
    }, 100);
">
    <template x-for="(flash, index) in flashes" :key="index">
        <div x-show="flashes.includes(flash)" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="transform opacity-0 translate-x-full" x-transition:enter-end="transform opacity-100 translate-x-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="transform opacity-100 translate-x-0" x-transition:leave-end="transform opacity-0 translate-x-full" class="flex items-center w-full max-w-sm p-4 rounded-lg shadow-lg border" :class="flash[0] === 'success' ? 'bg-green-50 border-green-200 dark:bg-green-900/20 dark:border-green-800' : flash[0] === 'error' ? 'bg-red-50 border-red-200 dark:bg-red-900/20 dark:border-red-800' : flash[0] === 'warning' ? 'bg-amber-50 border-amber-200 dark:bg-amber-900/20 dark:border-amber-800' : 'bg-blue-50 border-blue-200 dark:bg-blue-900/20 dark:border-blue-800'">
            <div class="flex-1">
                <p class="text-sm font-medium" :class="flash[0] === 'success' ? 'text-green-800 dark:text-green-200' : flash[0] === 'error' ? 'text-red-800 dark:text-red-200' : flash[0] === 'warning' ? 'text-amber-800 dark:text-amber-200' : 'text-blue-800 dark:text-blue-200'" x-text="flash[1]"></p>
            </div>
            <button @click="flashes.splice(index, 1)" class="ml-4 p-1 rounded hover:bg-black/10 dark:hover:bg-white/10 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </template>
</div>
