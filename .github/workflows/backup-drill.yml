name: backup-drill

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate ephemeral test secrets
        run: |
          {
            echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "FERNET_KEY=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          } >> "$GITHUB_ENV"
      - name: Backup round-trip tests
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
        run: pytest tests/integration/test_backup.py -q
      - name: CLI drill on a scratch SQLite database
        env:
          FLASK_APP: wsgi.py
          FLASK_ENV: development
          DATABASE_URL: sqlite:////tmp/drill.db
        run: |
          rm -f /tmp/drill.db /tmp/site-a.json /tmp/site-b.json
          python -c "from wsgi import app; from app.extensions import db; app.app_context().push(); db.create_all()"
          flask backup-site --output /tmp/site-a.json
          flask restore --input /tmp/site-a.json --yes
          flask backup-site --output /tmp/site-b.json
          python -c "
          import json
          a = {k: v for k, v in json.load(open('/tmp/site-a.json'))['manifest']['fingerprints'].items()}
          b = {k: v for k, v in json.load(open('/tmp/site-b.json'))['manifest']['fingerprints'].items()}
          assert a == b, 'restore drill: fingerprints differ'
          print('restore drill: zero diff across', len(a), 'tables')
          "
