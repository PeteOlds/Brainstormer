name: fast-checks

# Advisory while the existing baseline is cleaned up (RM-069). These checks
# are deliberately NOT required by branch protection yet: making them
# required today would block every PR on pre-existing formatting/type debt.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Black
        continue-on-error: true
        run: black --check app tests
      - name: isort
        continue-on-error: true
        run: isort --check-only app tests
      - name: mypy
        continue-on-error: true
        run: mypy app
      - name: Advisory summary
        run: echo "Fast checks are advisory until RM-069 clears the baseline and makes them required."
