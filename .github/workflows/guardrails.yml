name: guardrails

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install bandit safety
      - name: SAST and dependency audit
        run: |
          bandit -r app/ -f txt
          safety check
      - name: Guardrail scripts
        run: |
          python scripts/check_no_external_calls.py
          python scripts/check_no_secrets.py
      - name: Flutter gates
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
      - run: flutter pub get
        working-directory: flutter
      - run: flutter analyze --no-pub
        working-directory: flutter
      - run: flutter test --coverage
        working-directory: flutter
      - name: Generate ephemeral test secrets
        run: |
          {
            echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "FERNET_KEY=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          } >> "$GITHUB_ENV"
      - name: Backend suite with coverage gate
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
        run: pytest
      - name: Install Playwright
        run: python -m playwright install chromium
      - name: Browser UI tests
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
          SECRET_KEY: ${{ env.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ env.JWT_SECRET_KEY }}
          FERNET_KEY: ${{ env.FERNET_KEY }}
        run: pytest -m ui tests/ui/ --no-cov

  flutter-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Generate ephemeral test secrets
        run: |
          {
            echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "FERNET_KEY=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          } >> "$GITHUB_ENV"
      - name: Start scratch backend
        env:
          FLASK_ENV: development
          DATABASE_URL: sqlite:////tmp/itest.db
          APP_BASE_URL: http://127.0.0.1:8123
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from app import create_app; from app.extensions import db; app = create_app('development'); app.app_context().push(); db.create_all()"
          nohup python -c "
          import asyncio
          from hypercorn.asyncio import serve
          from hypercorn.config import Config
          from app import create_app
          config = Config()
          config.bind = ['127.0.0.1:8123']
          asyncio.run(serve(create_app('development'), config))
          " > /tmp/itest-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/api/health && break || sleep 4
          done
      - name: Flutter integration on Chrome
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - name: Flutter integration smoke (headless)
        # The API contract smoke runs on the VM: Chrome would enforce CORS
        # on the scratch backend (no CORS headers by design), so the
        # browser leg is covered by the `flutter-integration-chrome` job.
        working-directory: flutter
        run: |
          cp integration_test/app_test.dart test/zz_it_smoke_test.dart
          flutter test test/zz_it_smoke_test.dart --dart-define=API_BASE_URL=http://127.0.0.1:8123
          rm test/zz_it_smoke_test.dart

  flutter-integration-chrome:
    # Device-CI leg: compile the web target and run the widget/unit suite
    # inside real Chrome. Golden images are OS/font specific and stay on
    # the VM job (excluded by tag).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - name: Web build compiles
        working-directory: flutter
        run: flutter build web --release
      - name: Widget + unit tests in Chrome
        working-directory: flutter
        run: flutter test --platform chrome test/ --exclude-tags golden
